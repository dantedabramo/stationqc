<title>StationQC — The right stop. The right price.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--b:#0b4fd6;--b2:#2e93f2;--bd:#06235e;--g:#3fcf84;--r:#e5322d;--ink:#0d1b33;--mu:#5a6785;--bg:#fafcff;--tint:#eaf2fd;--ln:#dfe7f4;--ff:'Space Grotesk',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--ff);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}a{color:inherit;text-decoration:none}
.w{max-width:1080px;margin:0 auto;padding:0 24px}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;transition:.35s}
nav.s{background:rgba(250,252,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--ln)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:-.02em;cursor:pointer}
.logo img{width:34px;height:34px;border-radius:9px}.logo i{color:var(--b);font-style:normal;margin-left:-9px}
.nl{display:flex;align-items:center;gap:26px;font-size:15px;font-weight:500;color:var(--mu)}
.nl a{cursor:pointer;transition:.2s}.nl a:hover{color:var(--b)}
.lang{display:flex;background:var(--tint);border-radius:99px;padding:3px}
.lang button{font:600 12px var(--ff);border:0;background:none;color:var(--mu);padding:6px 11px;border-radius:99px;cursor:pointer;transition:.25s}
.lang button.on{background:#fff;color:var(--b);box-shadow:0 1px 4px rgba(11,79,214,.18)}
.btn{display:inline-flex;align-items:center;gap:9px;font:600 15px var(--ff);padding:14px 24px;border-radius:99px;border:1px solid var(--ln);background:#fff;color:var(--ink);cursor:pointer;transition:.3s cubic-bezier(.2,.8,.2,1)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px -10px rgba(11,79,214,.35)}
.btn.p{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border:0}
.btn svg{width:18px;height:18px}
.acts{align-items:center}.acts .btn{height:56px;border-radius:14px;padding:0 26px}
.badge{display:inline-block;line-height:0;border-radius:11px;cursor:pointer;transition:.3s cubic-bezier(.2,.8,.2,1)}.badge img{height:56px;width:auto;display:block}.badge:hover{transform:translateY(-3px);box-shadow:0 14px 28px -10px rgba(6,35,94,.5)}.cta .badge:hover{box-shadow:0 14px 30px -8px rgba(0,0,0,.45)}
.pg{display:none}.pg.on{display:block;animation:pgin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
.hero{position:relative;text-align:center;padding:150px 0 90px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;z-index:-1;animation:dr 14s ease-in-out infinite alternate}
.b1{width:480px;height:480px;background:#9cc8ff;top:-120px;left:-100px}.b2{width:420px;height:420px;background:#b9f0d3;top:60px;right:-120px;animation-delay:-5s}
@keyframes dr{to{transform:translate(60px,40px) scale(1.15)}}
.eye{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--b)}
.eye:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 0 0 rgba(63,207,132,.6);animation:pu 2s infinite}
@keyframes pu{70%{box-shadow:0 0 0 9px rgba(63,207,132,0)}}
h1{font-size:clamp(44px,8vw,86px);line-height:1.02;letter-spacing:-.045em;margin:18px 0 22px;font-weight:700}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--b),var(--b2) 60%,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(32px,4.6vw,52px);line-height:1.08;letter-spacing:-.035em;margin:12px 0 16px;font-weight:600}
.lead{color:var(--mu);font-size:19px;max-width:620px;margin:0 auto 32px}
.hero .eye,.hero h1,.hero .lead,.hero .acts,.hero .note{opacity:0;animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1{animation-delay:.1s}.hero .lead{animation-delay:.22s}.hero .acts{animation-delay:.34s}.hero .note{animation-delay:.46s}
@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.note{font-size:13px;color:var(--mu);margin-top:16px}
.stage{position:relative;width:240px;height:240px;margin:54px auto 0;opacity:0;animation:up 1.1s .55s cubic-bezier(.2,.8,.2,1) forwards}
.stage .ic{width:200px;height:200px;margin:20px;border-radius:46px;box-shadow:0 40px 70px -24px rgba(11,79,214,.55),0 0 0 1px rgba(255,255,255,.4) inset;animation:fl 6s ease-in-out infinite}
.stage .st{position:absolute;width:128px;filter:drop-shadow(0 14px 18px rgba(13,27,51,.18))}
.st.l{left:-120px;top:20px;animation:fl 5s -1s ease-in-out infinite;--rot:-8deg}.st.r{right:-120px;bottom:0;animation:fl 5.5s -2.5s ease-in-out infinite;--rot:7deg}
@keyframes fl{50%{transform:translateY(-14px) rotate(var(--rot,0deg))}}
.strip{background:var(--tint);border-block:1px solid var(--ln)}
.strip .w{display:flex;justify-content:space-around;flex-wrap:wrap;gap:12px 28px;padding-block:20px;font-size:14px;font-weight:500;color:var(--bd)}
.strip span{display:flex;align-items:center;gap:9px}.strip svg{width:18px;height:18px;color:var(--b)}
section{padding:96px 0}
.hd{max-width:640px;margin-bottom:48px}.hd p{color:var(--mu);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:28px;transition:.4s cubic-bezier(.2,.8,.2,1)}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 44px -22px rgba(11,79,214,.3);border-color:#bcd3f6}
.card h3{font-size:19px;margin:18px 0 8px;letter-spacing:-.01em}.card p{margin:0;color:var(--mu);font-size:15px;line-height:1.6}
.ico{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--tint),#d6e7ff);display:grid;place-items:center;color:var(--b);transition:.4s}
.card:hover .ico{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;transform:rotate(-6deg) scale(1.06)}
.ico svg{width:23px;height:23px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;text-align:center}
.stats b{display:block;font-size:clamp(40px,6vw,64px);letter-spacing:-.04em;line-height:1;background:linear-gradient(135deg,var(--b),var(--b2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{color:var(--mu);font-size:15px}
.band{background:var(--tint);border-block:1px solid var(--ln)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.ck{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.ck li{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.ck svg{flex:none;width:22px;height:22px;margin-top:2px;padding:4px;border-radius:50%;background:var(--g);color:#fff}
.route{background:#fff;border:1px solid var(--ln);border-radius:28px;padding:20px;box-shadow:0 30px 60px -34px rgba(11,79,214,.4)}
.route svg{width:100%;height:auto;display:block;overflow:visible}
.rp{fill:none;stroke:var(--b);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.route.in .rp{animation:dw 2.6s .2s ease-out forwards}@keyframes dw{to{stroke-dashoffset:0}}
.pin{opacity:0;transform-box:fill-box;transform-origin:center bottom}
.route.in .pin{animation:pn .6s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes pn{from{opacity:0;transform:translateY(-24px) scale(.4)}to{opacity:1;transform:none}}
.day{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.day .card{background:linear-gradient(#fff,#f6faff)}
.mq{overflow:hidden;padding:12px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq div{display:flex;gap:26px;width:max-content;animation:mqa 38s linear infinite}.mq:hover div{animation-play-state:paused}
.mq img{width:150px;height:150px;transition:.3s}.mq img:hover{transform:scale(1.14) rotate(-5deg)}
@keyframes mqa{to{transform:translateX(-50%)}}
details{border-bottom:1px solid var(--ln)}details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:20px 0;font-weight:600;font-size:17px}
summary::-webkit-details-marker{display:none}summary:after{content:"+";font-size:26px;line-height:1;color:var(--b);transition:.35s}
details[open] summary:after{transform:rotate(135deg)}details p{margin:0 0 20px;color:var(--mu);animation:fd .45s ease}
@keyframes fd{from{opacity:0;transform:translateY(-8px)}}
.cta{text-align:center;background:linear-gradient(135deg,var(--bd),var(--b) 55%,var(--b2));color:#fff;border-radius:34px;padding:72px 24px;position:relative;overflow:hidden}
.cta h2{margin:0 0 12px}.cta p{opacity:.85;margin:0 auto 28px;max-width:480px}.cta .btn{background:#fff;color:var(--b)}
.cta>img{width:84px;margin:0 auto 22px;border-radius:20px;animation:fl 5s ease-in-out infinite}
footer .logo{color:var(--ink)}
.doc{max-width:720px;padding:140px 24px 80px;margin:0 auto}.doc h1{font-size:clamp(38px,6vw,60px);margin:10px 0 12px}
.doc .up{color:var(--mu);font-size:14px;margin:0 0 36px}
.doc h3{font-size:20px;margin:34px 0 8px;padding-top:26px;border-top:1px solid var(--ln);letter-spacing:-.01em}.doc p{color:var(--mu);margin:0 0 10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:36px}
.sg ol{margin:12px 0 0;padding-left:20px;color:var(--mu);font-size:15px;display:grid;gap:6px}
footer{border-top:1px solid var(--ln);padding:48px 0 40px;margin-top:40px;font-size:14px;color:var(--mu)}
footer .w{display:grid;grid-template-columns:1fr auto;gap:20px 40px}
footer .fl{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}.fl a{cursor:pointer;transition:.2s}.fl a:hover{color:var(--b)}
footer small{grid-column:1/-1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
@media(max-width:860px){.grid,.day,.sg{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr;gap:36px}.stats{grid-template-columns:1fr 1fr;gap:30px}.nl .h{display:none}.st{width:96px!important}.st.l{left:-70px}.st.r{right:-70px}}
@media(max-width:600px){body{font-size:16px}section{padding:68px 0}.grid,.day,.sg{grid-template-columns:1fr}.hero{padding-top:118px}footer .w{grid-template-columns:1fr}footer .fl{justify-content:flex-start}.btn{padding:13px 20px}.nl{gap:12px}.stage{margin-top:44px}.st.l{left:-52px}.st.r{right:-52px}.st{width:84px!important}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv,.hero .eye,.hero h1,.hero .lead,.hero .acts,.hero .note,.stage,.pin{opacity:1!important;transform:none!important}.rp{stroke-dashoffset:0}html{scroll-behavior:auto}}
</style>
</head>

q:[['Where can I use StationQC?','StationQC covers Québec. If you are elsewhere, pick a Québec region and explore the map from there.'],['Is there an Android version?','No. StationQC is an iPhone app, available on the App Store.'],['Which fuel types are supported?','Regular, Premium and Diesel.'],['Where do fuel prices come from?','From Gas Québec. Prices can change between updates, and the price at the pump is always the final word.'],['Do I need to share my location?','It is optional, but it unlocks nearby stations sorted by distance and your widgets. Your location is used on your device only, and we never sell it. Without it, you can still pick a region or search.'],['Does it work offline?','Partly. You will see the latest prices available with a notice that they may be out of date. Routes and place search need a connection.'],['Do I need an account?','No account and no sign-up. Open the app and go.']],

P:[['Our approach','StationQC is built to work without an account and with as little personal information as possible. This policy explains what the app uses and why.'],['What the app uses','With your permission, your approximate or precise location while you use the app, to show nearby stations. Your preferences (fuel type, region, map style, saved stations and recent places) are saved on your device, and shared with the StationQC widgets on that device.'],['How location is used','To list and sort stations near you, to power the widgets and Siri shortcuts, and to start trips from your position. You can change or withdraw this permission anytime in Settings → Privacy & Security → Location Services.'],['Third-party services','Fuel prices are retrieved from Gas Québec. Maps, place search and routes use Apple Maps services, and Siri and Shortcuts are provided by Apple. Those services handle data under their own privacy policies.'],['What we do not do','StationQC has no accounts, no advertising and no third-party analytics or tracking. We do not sell or rent your personal information.'],['Your control','You can clear recent places and saved stations in the app, and delete the app to remove its data from your device. Because StationQC does not hold an account for you, your information stays under your control on your device.'],['Children','StationQC is not directed to children and does not knowingly collect personal information from them.'],['Your rights and changes','If you live in Québec or elsewhere in Canada, you have rights over your personal information under applicable privacy laws. We may update this policy; the date above will change accordingly.']],
T:[['Using the service','StationQC provides information about gas stations and fuel prices in Québec. By using the app, you agree to these terms. If you do not agree, please stop using it.'],['Fuel prices and station information','Data comes from sources including Gas Québec and may be incomplete, delayed or inaccurate. StationQC does not guarantee fuel prices, availability or opening hours. The price at the pump takes precedence, and no savings are guaranteed.'],['Road safety and directions','Do not use the app in a way that distracts you while driving. Stop in a safe place before interacting with your device. Route information is guidance only; follow road signs, conditions and applicable laws.'],['Location and permissions','Some features, including nearby search, widgets and shortcuts, depend on Internet access and device permissions, which you can change in your device settings. See our privacy policy for how information is handled.'],['Acceptable use and ownership','Do not use the service for unlawful activities, interfere with its operation or access its systems without authorization. The app, its name and its visual assets remain the property of their owners. Station brands belong to their respective owners.'],['Third-party services','StationQC relies on third-party services, including fuel data and mapping providers. Their availability and terms may change, and features may be interrupted, changed or removed.'],['Liability and consumer rights','To the extent permitted by law, the service is provided without a guarantee of uninterrupted or error-free operation. Nothing in these terms removes statutory warranties, mandatory consumer rights or liability that cannot legally be excluded.'],['Changes','These terms may be updated and the date on this page will change accordingly. For help with common issues, visit the support page.']]},

q:[['Où puis-je utiliser StationQC?','StationQC couvre le Québec. Si vous êtes ailleurs, choisissez une région du Québec et explorez la carte.'],['Existe-t-il une version Android?','Non. StationQC est une app pour iPhone, offerte sur l’App Store.'],['Quels carburants sont pris en charge?','L’ordinaire, le super et le diesel.'],['D’où viennent les prix?','De Gaz Québec. Les prix peuvent changer entre les mises à jour, et le prix à la pompe a toujours le dernier mot.'],['Dois-je partager ma position?','C’est facultatif, mais cela permet d’afficher les stations à proximité triées par distance, ainsi que vos widgets. Votre position est utilisée sur votre appareil seulement et nous ne la vendons jamais. Sans elle, vous pouvez choisir une région ou faire une recherche.'],['Est-ce que ça fonctionne hors ligne?','En partie. Vous verrez les derniers prix disponibles, avec un avis qu’ils peuvent ne pas être à jour. Les itinéraires et la recherche de lieux nécessitent une connexion.'],['Faut-il un compte?','Aucun compte, aucune inscription. Ouvrez l’app et c’est parti.']],

P:[['Notre approche','StationQC est conçue pour fonctionner sans compte et avec le moins de renseignements personnels possible. Cette politique explique ce que l’app utilise et pourquoi.'],['Ce que l’app utilise','Avec votre autorisation, votre position approximative ou précise pendant que vous utilisez l’app, pour afficher les stations à proximité. Vos préférences (carburant, région, style de carte, stations enregistrées et lieux récents) sont conservées sur votre appareil et partagées avec les widgets StationQC de cet appareil.'],['Utilisation de la position','Pour lister et trier les stations près de vous, alimenter les widgets et les raccourcis Siri, et démarrer un trajet depuis votre position. Vous pouvez modifier ou retirer cette autorisation en tout temps dans Réglages → Confidentialité et sécurité → Service de localisation.'],['Services tiers','Les prix du carburant proviennent de Gaz Québec. Les cartes, la recherche de lieux et les itinéraires utilisent les services Plans d’Apple, et Siri et Raccourcis sont fournis par Apple. Ces services traitent les données selon leurs propres politiques de confidentialité.'],['Ce que nous ne faisons pas','StationQC n’a aucun compte, aucune publicité ni aucun outil d’analyse ou de suivi tiers. Nous ne vendons ni ne louons vos renseignements personnels.'],['Votre contrôle','Vous pouvez effacer les lieux récents et les stations enregistrées dans l’app, et supprimer l’app pour retirer ses données de votre appareil. Comme StationQC ne détient aucun compte à votre nom, vos renseignements demeurent sous votre contrôle sur votre appareil.'],['Enfants','StationQC ne s’adresse pas aux enfants et ne recueille pas sciemment de renseignements personnels auprès d’eux.'],['Vos droits et les modifications','Si vous habitez au Québec ou ailleurs au Canada, vous avez des droits sur vos renseignements personnels en vertu des lois applicables. Nous pouvons mettre à jour cette politique; la date ci-dessus changera en conséquence.']],
T:[['Utilisation du service','StationQC fournit de l’information sur les stations-service et les prix du carburant au Québec. En utilisant l’app, vous acceptez ces conditions. Sinon, veuillez cesser de l’utiliser.'],['Prix et information sur les stations','Les données proviennent de sources dont Gaz Québec et peuvent être incomplètes, en retard ou inexactes. StationQC ne garantit ni les prix, ni la disponibilité du carburant, ni les heures d’ouverture. Le prix à la pompe prévaut, et aucune économie n’est garantie.'],['Sécurité routière et itinéraires','N’utilisez pas l’app d’une façon qui vous distrait au volant. Arrêtez-vous dans un endroit sûr avant de manipuler votre appareil. Les itinéraires sont fournis à titre indicatif; respectez la signalisation, l’état de la route et les lois applicables.'],['Position et autorisations','Certaines fonctions, dont la recherche à proximité, les widgets et les raccourcis, dépendent de l’accès à Internet et des autorisations de l’appareil, que vous pouvez modifier dans les réglages. Consultez notre politique de confidentialité pour savoir comment l’information est traitée.'],['Utilisation acceptable et propriété','N’utilisez pas le service à des fins illégales, n’entravez pas son fonctionnement et n’accédez pas à ses systèmes sans autorisation. L’app, son nom et ses éléments visuels demeurent la propriété de leurs titulaires. Les marques de stations appartiennent à leurs propriétaires respectifs.'],['Services tiers','StationQC s’appuie sur des services tiers, notamment des fournisseurs de données sur le carburant et de cartographie. Leur disponibilité et leurs conditions peuvent changer, et des fonctions peuvent être interrompues, modifiées ou retirées.'],['Responsabilité et droits des consommateurs','Dans la mesure permise par la loi, le service est fourni sans garantie de fonctionnement ininterrompu ou sans erreur. Rien dans ces conditions ne retire les garanties légales, les droits impératifs des consommateurs ni une responsabilité qui ne peut être exclue.'],['Modifications','Ces conditions peuvent être mises à jour et la date de cette page changera en conséquence. Pour de l’aide avec les problèmes courants, consultez la page de soutien.']]}

try{const v=localStorage.getItem('sqc-lang');if(v==='fr'||v==='en')lang=v;else if((navigator.language||'').toLowerCase().startsWith('fr'))lang='fr'}catch(e){}
const rv=()=>{io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);if(e.target.id==='stats')count()}}),{threshold:.15});$$('.rv:not(.in),.route:not(.in)').forEach(el=>io.observe(el))};
function count(){$$('#stats b').forEach(b=>{const n=+b.dataset.n,t0=performance.now();(function f(t){const p=Math.min((t-t0)/1400,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function render(){
 const t=D[lang];document.documentElement.lang=lang==='fr'?'fr-CA':'en';
 document.title=lang==='fr'?'StationQC — Le bon arrêt. Le bon prix.':'StationQC — The right stop. The right price.';
 $$('[data-i18n]').forEach(e=>e.textContent=t[e.dataset.i18n]);
 $$('.badge').forEach(a=>{a.setAttribute('aria-label',t.get);a.setAttribute('role','link');$('img',a).src=BADGE[lang];$('img',a).alt=t.get});
 $$('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
 $('#strip').innerHTML=t.strip.map(([i,x])=>`<span>${ic(i)}${x}</span>`).join('');
 const card=([i,h,p],k)=>`<div class="card rv" style="--d:${(k%3)*.1}s"><div class="ico">${ic(i)}</div><h3>${h}</h3><p>${p}</p></div>`;
 $('#fgrid').innerHTML=t.f.map(card).join('');$('#dgrid').innerHTML=t.d.map(card).join('');
 $('#stats').innerHTML=t.stats.map(([n,l])=>`<div><b data-n="${n}">0</b><span>${l}</span></div>`).join('');
 const st=$('#stats');st.classList.remove('in','rv');void st.offsetWidth;st.classList.add('rv');
 $('#tl').innerHTML=t.t.map(x=>`<li>${ic('ck')}${x}</li>`).join('');
 $('#mq').innerHTML=[...S,...S].map(s=>`<img src="${s}" alt="" loading="lazy" width="150" height="150">`).join('');
 $('#faq').innerHTML=t.q.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('');
 $('#sg').innerHTML=t.s.map(([h,l])=>`<div class="card"><h3 style="margin-top:0">${h}</h3><ol>${l.map(x=>`<li>${x}</li>`).join('')}</ol></div>`).join('');
 const doc=a=>a.map(([h,p],i)=>`<h3>${i+1}. ${h}</h3><p>${p}</p>`).join('');
 $('#pb').innerHTML=doc(t.P);$('#tb').innerHTML=doc(t.T);
 rv();
}
function route(){
 const r=(location.hash.replace('#/','')||'home');const id=['support','privacy','terms'].includes(r)?r:'home';
 $$('.pg').forEach(p=>p.classList.toggle('on',p.id===id));window.scrollTo(0,0);
 requestAnimationFrame(()=>{rv();if(id==='home'&&window._go){const g=window._go;window._go=null;scrollTo2(g)}});
}
function scrollTo2(g){const el=g==='top'?document.body:document.getElementById(g);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;try{localStorage.setItem('sqc-lang',lang)}catch(x){}render();return}
 const a=e.target.closest('[data-app]');if(a){window.open(APP_STORE_URL,'_blank','noopener');return}
 const r=e.target.closest('[data-r]');if(r){e.preventDefault();location.hash='#/'+r.dataset.r;return}
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();if($('#home').classList.contains('on'))scrollTo2(g.dataset.go);else{window._go=g.dataset.go;location.hash='#/'}}
});
addEventListener('hashchange',route);
addEventListener('scroll',()=>$('#nav').classList.toggle('s',scrollY>10),{passive:true});
render();route();
